[tasks.qemu]
dependencies = ["build"]
command = "qemu-system-riscv64"
args = [
  "-machine", "virt",
  "-cpu", "rv64",
  "-m", "128M",
  "-smp", "1",
  "-nographic",
  "-bios", "default",
  "-kernel", "target/riscv64gc-unknown-none-elf/debug/rkrv",
]

[tasks.qemu_debug]
dependencies = ["build"]
command = "qemu-system-riscv64"
args = [
  "-machine", "virt",
  "-cpu", "rv64",
  "-m", "128M",
  "-smp", "1",
  "-nographic",
  "-bios", "default",
  "-kernel", "target/riscv64gc-unknown-none-elf/debug/rkrv",
  "-S",
  "-gdb", "tcp::1234",
]

[tasks.gdb]
env = { RUST_GDB = "gdb-multiarch" }
command = "rust-gdb"
args = [
  "target/riscv64gc-unknown-none-elf/debug/rkrv",
  "-ex", "set architecture riscv:rv64",
  "-ex", "target remote :1234",
]
